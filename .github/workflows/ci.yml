name: CinéBox checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: CSP static check
        run: npm run check:csp
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: cinebox-static-export
          path: out
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        run: npm run test:e2e

  csp-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the exact build under test
        uses: actions/download-artifact@v4
        with:
          name: cinebox-static-export
          path: out
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: CSP smoke test on the static export
        run: npm run test:csp

  auth-integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the exact build under test
        uses: actions/download-artifact@v4
        with:
          name: cinebox-static-export
          path: out
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Admin auth against the real Pages Functions runtime
        run: npm run test:integration
